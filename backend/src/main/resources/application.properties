spring.application.name=crm
server.port=${SERVER_PORT:9090}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

#hilos virtuales
spring.threads.virtual.enabled=true

# Configuracion SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CORREO_USERNAME}
spring.mail.password=${CORREO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email remitente personalizado
app.mail.from=nexus@gmail.com

# Twilio - WhatsApp webhook signature validation
twilio.auth-token=${TWILIO_AUTH_TOKEN}

