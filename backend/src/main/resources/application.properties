spring.application.name=crm
server.port=${SERVER_PORT:9090}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

#hilos virtuales
spring.threads.virtual.enabled=true

# Brevo API Configuration
app.brevo.api.key=${BREVO_API_KEY:}
app.brevo.from.email=anth87659@gmail.com
app.brevo.from.name=CRM Team

# Twilio - WhatsApp webhook signature validation
twilio.auth-token=${TWILIO_AUTH_TOKEN}

# Logging para debugging de email
logging.level.nocountry.crm.feature.email=DEBUG
